name: Release

# On a version tag: build the sdist and wheel, check what went into them, and
# attach both to a GitHub Release. Nothing is published to PyPI.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist/

      - name: Tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('beer_in_this_town/__init__.py').read_text()).group(1))")
          test "$tag" = "$version" || { echo "tag $tag != __version__ $version"; exit 1; }

      - name: Nothing private in the sdist
        run: |
          tar -tzf dist/*.tar.gz > contents.txt
          cat contents.txt
          if grep -E '/(\.claude|\.local|state|data|cache|chrome-profile|debug|logs)/|storage_state\.json' contents.txt; then
            echo "private path in sdist"; exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
