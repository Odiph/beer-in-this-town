name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check beer_in_this_town tests

      - name: Test
        # Offline only. Nothing in CI touches Untappd, Google or an emulator.
        # Everything that is not explicitly `integration` runs: `-m unit`
        # used to skip every unmarked test.
        run: pytest -q -m "not integration"

      - name: Agent contract smoke test
        # The JSON envelope is the public API; assert it stays parseable.
        # `status` is read-only and always exists; no other command is assumed.
        run: |
          python -m beer_in_this_town status --json > envelope.json
          python -c "import json; d=json.load(open('envelope.json')); assert d['schema_version']=='1.0', d; assert isinstance(d['next_actions'], list); assert 'ok' in d; print('envelope ok')"
