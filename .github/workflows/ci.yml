name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check beer_in_this_town tests

      - name: Test
        # Offline only. Nothing in CI touches Untappd or Google.
        run: pytest -q -m unit

      - name: Agent contract smoke test
        # The JSON envelope is the public API; assert it stays parseable.
        run: |
          python -m beer_in_this_town status --json > envelope.json
          python -c "import json,sys; d=json.load(open('envelope.json')); assert d['schema_version']=='1.0'; assert 'next_actions' in d; print('envelope ok')"
