<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>beer in this town — setup</title>
<style>
  /* No external anything: the page's CSP is default-src 'none'. System
     fonts only, which is also why nothing here waits on a webfont. */
  :root{
    --ground:#F7F5F1; --surface:#FFFFFF; --sunk:#EFEBE4;
    --ink:#1B1814; --muted:#6B6257; --line:#DFD8CD;
    --accent:#A6631B; --accent-ink:#FFFFFF;
    --ok:#2F6F43; --ok-wash:#E6F0E8;
    --warn:#9A4A16; --warn-wash:#F8E8DC;
    --unknown:#6B6257; --unknown-wash:#EFEBE4;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#14120F; --surface:#1D1A16; --sunk:#26221C;
      --ink:#EFEAE2; --muted:#A1978A; --line:#332E27;
      --accent:#E0A050; --accent-ink:#1B1409;
      --ok:#6FC58C; --ok-wash:#17281D;
      --warn:#E3915F; --warn-wash:#2E1E13;
      --unknown:#A1978A; --unknown-wash:#26221C;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:0 16px 64px; background:var(--ground); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px; margin:0 auto}

  header{padding-block:28px 6px}
  h1{font-size:22px; margin:0 0 4px; letter-spacing:-.01em}
  .sub{color:var(--muted); font-size:14px; margin:0}

  .banner{
    margin-top:18px; padding:12px 14px; border-radius:10px;
    background:var(--sunk); border:1px solid var(--line); font-size:14px;
  }
  .banner.good{background:var(--ok-wash); border-color:var(--ok); color:var(--ok)}
  .banner.bad{background:var(--warn-wash); border-color:var(--warn); color:var(--warn)}

  h2{
    font-size:12px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); margin:26px 0 8px; font-weight:600;
  }

  ul.checks{list-style:none; margin:0; padding:0;
    border:1px solid var(--line); border-radius:12px; overflow:hidden;
    background:var(--surface)}
  ul.checks li{
    display:flex; gap:12px; align-items:flex-start;
    padding:13px 14px; border-top:1px solid var(--line);
  }
  ul.checks li:first-child{border-top:0}
  .dot{
    flex:none; width:9px; height:9px; border-radius:50%; margin-top:6px;
    background:var(--unknown);
  }
  li[data-s="ok"] .dot{background:var(--ok)}
  li[data-s="attention"] .dot{background:var(--warn)}
  li[data-s="off"] .dot{background:var(--line)}
  .body{flex:1; min-width:0}
  .label{font-weight:600; font-size:14.5px}
  .detail{color:var(--muted); font-size:13.5px; overflow-wrap:anywhere}
  .fix{font-size:13.5px; margin-top:3px}
  .tag{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.04em;
    text-transform:uppercase; padding:2px 6px; border-radius:4px;
    background:var(--unknown-wash); color:var(--muted); margin-left:8px;
    white-space:nowrap;
  }
  .tag.tested{background:var(--ok-wash); color:var(--ok)}

  .actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px}
  button{
    font:inherit; font-weight:600; font-size:14px; cursor:pointer;
    border-radius:10px; padding:11px 16px; border:1.5px solid var(--line);
    background:var(--surface); color:var(--ink);
  }
  button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  button:disabled{opacity:.45; cursor:default}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* activity: the point of the page while something is running */
  .job{
    margin-top:14px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:14px;
  }
  .jobhead{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .jobhead strong{font-size:14.5px}
  .clock{font-family:var(--mono); font-size:12.5px; color:var(--muted); margin-left:auto;
         font-variant-numeric:tabular-nums}
  .pulse{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--accent); margin-right:6px; animation:beat 1.1s infinite;
  }
  @keyframes beat{0%,100%{opacity:1}50%{opacity:.25}}
  ol.steps{list-style:none; margin:12px 0 0; padding:0; font-size:13.5px}
  ol.steps li{display:flex; gap:9px; padding:3px 0}
  ol.steps li .t{font-family:var(--mono); font-size:11.5px; color:var(--muted);
                 flex:none; padding-top:2px; font-variant-numeric:tabular-nums}
  ol.steps li.aside{color:var(--muted)}
  ol.steps li.aside .txt::before{content:"— "}
  .err{color:var(--warn); font-size:13.5px; margin-top:10px}

  footer{margin-top:28px; color:var(--muted); font-size:13px}
  code{font-family:var(--mono); font-size:12.5px; background:var(--sunk);
       padding:1px 5px; border-radius:4px}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>beer in this town</h1>
    <p class="sub">Get connected once. Everything after this runs from the terminal.</p>
  </header>

  <div class="banner" id="banner">Loading…</div>

  <h2>Setup</h2>
  <ul class="checks" id="checks"></ul>

  <div class="actions">
    <button class="primary" id="connect" type="button">Connect accounts</button>
    <button id="verify" type="button">Test both accounts</button>
    <button id="selectors" type="button">Check Untappd's pages</button>
  </div>

  <div id="activity"></div>

  <footer>
    This page only reads your setup and signs you in. It can't save anything to
    your Google Maps lists — <code>pin</code> and <code>notes</code> have no
    button here and no route on this server.
  </footer>
</div>

<script>
// The key arrives in the URL fragment, which browsers never send in a Referer
// header or write to a server log. Read it once, then clear it from the bar.
const TOKEN = location.hash.slice(1);
if (TOKEN) history.replaceState(null, "", location.pathname);

const $ = id => document.getElementById(id);
const BUTTONS = ["connect", "verify", "selectors"];
let busy = false, lastJobId = null;

async function api(path, options) {
  const res = await fetch(path, {
    ...options,
    headers: { "Content-Type": "application/json", "X-Beertown-Token": TOKEN },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.message || ("HTTP " + res.status));
  return body;
}

function clock(seconds) {
  const s = Math.floor(seconds % 60), m = Math.floor(seconds / 60);
  return m + ":" + String(s).padStart(2, "0");
}

function renderChecks(rows) {
  const host = $("checks");
  host.textContent = "";
  for (const c of rows) {
    const li = document.createElement("li");
    li.dataset.s = c.state;

    const dot = document.createElement("span");
    dot.className = "dot";
    li.appendChild(dot);

    const body = document.createElement("div");
    body.className = "body";

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = c.label;
    // "Tested" is the whole distinction this page is built around: a cookie
    // on disk is not a working account.
    if (c.key === "google" || c.key === "untappd") {
      const tag = document.createElement("span");
      tag.className = "tag" + (c.verified ? " tested" : "");
      tag.textContent = c.verified ? "tested" : "not tested";
      label.appendChild(tag);
    }
    body.appendChild(label);

    const detail = document.createElement("div");
    detail.className = "detail";
    detail.textContent = c.detail;
    body.appendChild(detail);

    if (c.fix) {
      const fix = document.createElement("div");
      fix.className = "fix";
      fix.textContent = c.fix;
      body.appendChild(fix);
    }

    li.appendChild(body);
    host.appendChild(li);
  }
}

function renderBanner(state) {
  const el = $("banner");
  el.className = "banner";
  if (state.busy) {
    el.classList.add("");
    el.textContent = "Working — the log below says what's happening.";
    return;
  }
  if (state.ready) {
    el.classList.add("good");
    el.textContent = "Both accounts tested and working. You're ready to run.";
    return;
  }
  const n = state.blocking.length;
  if (n === 0) {
    el.textContent = "Nothing is broken, but the accounts haven't been tested "
      + "yet. Press “Test both accounts” — a saved cookie isn't proof.";
    return;
  }
  el.classList.add("bad");
  el.textContent = n === 1
    ? "One thing needs you. It's marked below."
    : n + " things need you. They're marked below.";
}

function renderJob(job) {
  const host = $("activity");
  if (!job) { host.textContent = ""; return; }

  // Rebuild only when the job or its step count changes, so the clock can
  // tick without the log flickering under the reader.
  const sig = job.id + ":" + job.steps.length + ":" + job.state;
  if (host.dataset.sig !== sig) {
    host.dataset.sig = sig;
    host.textContent = "";

    const box = document.createElement("div");
    box.className = "job";

    const head = document.createElement("div");
    head.className = "jobhead";
    const title = document.createElement("strong");
    if (job.state === "running") {
      const p = document.createElement("span");
      p.className = "pulse";
      title.appendChild(p);
    }
    title.appendChild(document.createTextNode(
      job.state === "running" ? job.title
      : job.state === "done" ? job.title + " — finished"
      : job.title + " — stopped"));
    head.appendChild(title);

    const c = document.createElement("span");
    c.className = "clock";
    c.id = "clock";
    c.textContent = clock(job.elapsed);
    head.appendChild(c);
    box.appendChild(head);

    const steps = document.createElement("ol");
    steps.className = "steps";
    const t0 = job.steps.length ? job.steps[0].at : 0;
    for (const s of job.steps) {
      const li = document.createElement("li");
      if (s.aside) li.className = "aside";
      const t = document.createElement("span");
      t.className = "t";
      t.textContent = clock(s.at - t0);
      const txt = document.createElement("span");
      txt.className = "txt";
      txt.textContent = s.text;
      li.append(t, txt);
      steps.appendChild(li);
    }
    box.appendChild(steps);

    if (job.error) {
      const e = document.createElement("div");
      e.className = "err";
      e.textContent = job.error;
      box.appendChild(e);
    }
    host.appendChild(box);
  } else {
    const c = $("clock");
    if (c) c.textContent = clock(job.elapsed);
  }
}

function renderButtons(state) {
  busy = state.busy;
  for (const id of BUTTONS) $(id).disabled = busy;
}

async function tick() {
  try {
    const state = await api("/api/state");
    renderChecks(state.checks);
    renderBanner(state);
    renderJob(state.job);
    renderButtons(state);
    if (state.job) lastJobId = state.job.id;
  } catch (e) {
    const el = $("banner");
    el.className = "banner bad";
    el.textContent = TOKEN
      ? "Lost contact with the dashboard: " + e.message
      : "This page is missing its key. Open the link the terminal printed.";
  }
}

for (const id of BUTTONS) {
  $(id).addEventListener("click", async () => {
    if (busy) return;
    renderButtons({ busy: true });
    try {
      await api("/api/run", { method: "POST", body: JSON.stringify({ action: id }) });
    } catch (e) {
      const el = $("banner");
      el.className = "banner bad";
      el.textContent = e.message;
      renderButtons({ busy: false });
      return;
    }
    tick();
  });
}

tick();
// One second is fast enough to feel live and slow enough that a fifteen
// minute sign-in does not make a thousand requests.
setInterval(tick, 1000);
</script>
</body>
</html>
