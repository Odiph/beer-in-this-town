[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beer-in-this-town"
dynamic = ["version"]
description = "Make a craft-beer map of a city in a Google Maps saved list, from the venues the Untappd app shows."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["untappd", "google-maps", "kml", "scraping", "agent", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
beertown = "beer_in_this_town.cli:main"

[tool.hatch.version]
path = "beer_in_this_town/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["beer_in_this_town"]

# An allowlist, not a denylist. The repo root holds a signed-in Chrome profile,
# storage_state.json, state/, data/ and cache/ -- none of it may ever ship, and
# an allowlist cannot be defeated by a new private directory nobody excluded.
[tool.hatch.build.targets.sdist]
include = [
    "/beer_in_this_town",
    "/tests",
    "/docs",
    "/README.md",
    "/AGENTS.md",
    "/SECURITY.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
    "/requirements.txt",
]
exclude = [
    "__pycache__",
    "*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, offline, no network or browser",
    "integration: touches the network or a browser",
]
filterwarnings = [
    "ignore::DeprecationWarning:bs4.*",
]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "B008",    # function call in default arg -- not used here
    "SIM105",  # contextlib.suppress is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
